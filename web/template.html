<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE4">
<title>五十音歌词记忆</title>
<style>
@font-face{font-family:"RHR";src:url(data:font/woff2;base64,/*__FONT__*/) format("woff2");font-weight:100 900;font-display:block}
:root{--fz:1;
  --bg:#F6EFE4;--card:#FFFBF4;--ink:#2B2420;--sub:#7A6C60;--line:#E6DACB;
  --accent:#E8674A;--accent-soft:#FBE1D8;--teal:#2F8F83;--teal-soft:#D6EEEA;
  --gold:#D9A21B;--gold-soft:#F8EBC6;--mark:#FFD86B;--shadow:0 2px 10px rgba(80,50,20,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1815;--card:#28221D;--ink:#F3EBE1;--sub:#B3A595;--line:#3D342C;
  --accent:#FF8A6B;--accent-soft:#4A2A22;--teal:#5CC4B5;--teal-soft:#1F3B37;
  --gold:#F0C04A;--gold-soft:#41361A;--mark:#8A6A10;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#1C1815;--card:#28221D;--ink:#F3EBE1;--sub:#B3A595;--line:#3D342C;
  --accent:#FF8A6B;--accent-soft:#4A2A22;--teal:#5CC4B5;--teal-soft:#1F3B37;
  --gold:#F0C04A;--gold-soft:#41361A;--mark:#8A6A10;--shadow:none;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"RHR","Resource Han Rounded CN","Noto Sans CJK JP",sans-serif;font-size:20px;line-height:1.6;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
header h1{font-size:26px;margin:0;letter-spacing:1px}
header .sub{font-size:16px;color:var(--sub)}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 4px;font-size:17px;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:17px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:26px;line-height:1}
nav.tabs button.on{color:var(--accent)}
section.page{display:none}section.page.on{display:block}
h2{font-size:22px;margin:22px 0 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--sub);margin:12px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;align-items:stretch}
.grid.y{grid-template-columns:auto repeat(3,1fr)}
.grid.x{grid-template-columns:repeat(4,1fr)}
.rowlab{font-size:14px;color:var(--sub);writing-mode:vertical-rl;text-align:center;align-self:center;padding:0 2px}
.cell{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 2px 4px;text-align:center;min-height:78px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);position:relative}
.cell.empty{background:transparent;border:0;box-shadow:none}
.cell .k{font-size: calc(34px * min(var(--fz), 1.12));line-height:1.1;font-weight:900}
.cell .k2{font-size: calc(34px * min(var(--fz), 1.12));line-height:1.1;font-weight:900;color:var(--teal)}
.cell.y,.cell.x{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 8px}
.cell.y .k,.cell.y .k2,.cell.x .k,.cell.x .k2{font-size: calc(30px * min(var(--fz), 1.12))}
.cell.y .r,.cell.x .r{flex-basis:100%}
.cell .r{font-size:14px;color:var(--sub);line-height:1.2}
.cell.s1{border-color:var(--gold)}.cell.s2{border-color:var(--teal)}.cell.s3{border-color:var(--teal);background:var(--teal-soft)}
.cell.weak::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:19px;background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.teal{background:var(--teal)}
.btn.small{padding:6px 12px;font-size:16px;border-radius:10px}
.btn.big{width:100%;font-size:26px;padding:20px;border-radius:20px;font-weight:900;letter-spacing:2px}
.say{border:0;background:var(--teal-soft);color:var(--teal);border-radius:999px;width:44px;height:44px;font-size:22px;flex:none}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
details.more summary,details.fold summary{cursor:pointer;list-style:none;font-size:19px}
details.more summary::-webkit-details-marker,details.fold summary::-webkit-details-marker{display:none}
details.more summary::after,details.fold summary::after{content:"▸";float:right;color:var(--sub)}
details.more[open] summary::after,details.fold[open] summary::after{content:"▾"}
.hbtn{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.hbtn b{display:block;font-size:21px}.hbtn span{font-size:15px;color:var(--sub)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats3 b{display:block;font-size:28px;line-height:1.2}.stats3 span{font-size:14px;color:var(--sub)}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0;display:flex}
.bar i{display:block;height:100%}
.focus{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.focus button{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:4px 14px;font-size:30px;font-weight:900}
/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;padding-bottom:40px}
.overlay.on{display:block}
#drill{z-index:25}#sheet{z-index:30}
.otop{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);z-index:2}
.otop .t{flex:1;text-align:center;font-size:16px;color:var(--sub);line-height:1.3}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .card{max-width:420px;width:100%;text-align:center}
/* detail */
.hero{display:flex;align-items:center;justify-content:center;gap:28px;padding:18px 0 6px;flex-wrap:wrap}
.hero .big{font-size: calc(120px * min(var(--fz), 1.15));line-height:1;font-weight:900}
.hero .big.kata{color:var(--teal)}
.hero .lab{font-size:15px;color:var(--sub);text-align:center}
.roma{text-align:center;font-size:30px;font-weight:900;color:var(--accent);letter-spacing:2px}
.roma small{font-size:18px;color:var(--sub);font-weight:400;letter-spacing:0}
.kv{display:grid;grid-template-columns:5.2em 1fr;gap:6px 10px;font-size:19px}
.kv b{color:var(--sub);font-weight:400}
.tip{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:19px;margin-top:10px}
.tip.red{background:var(--accent-soft)}
.word{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.word:last-child{border-bottom:0}
.word .w{font-size:28px;font-weight:900}
.word .m{color:var(--sub);font-size:18px}
.lyric{padding:14px 0;border-bottom:1px dashed var(--line)}
.lyric:last-child{border-bottom:0}
.ln{font-size:27px;line-height:1.3;font-weight:700}
.rm{font-size:16px;color:var(--sub);line-height:1.4;margin-top:2px;word-break:break-word}
.src{font-size:15px;color:var(--sub);margin-top:6px;display:flex;align-items:center;gap:10px}
.src span{flex:1}
rt{font-size:13px;color:var(--sub);font-weight:400}
.hide-rt rt{visibility:hidden}.hide-rm .rm{display:none}
mark{background:var(--mark);color:inherit;border-radius:6px;padding:0 2px}
rt mark{padding:0;border-radius:3px}
.pill{display:inline-block;font-size:14px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:3px}
.conf{display:flex;gap:10px;flex-wrap:wrap}
.conf button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 14px;font-size:30px;font-weight:900}
.conf .why{flex-basis:100%;font-size:18px;color:var(--sub)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:16px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.strokes{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.strokes svg{width:150px;height:150px;background:var(--bg);border:2px solid var(--line);border-radius:16px}
.strokes .gh{fill:none;stroke:var(--line);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.strokes .an{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.strokes .num{font-size:9px;fill:var(--sub);font-family:sans-serif}
.pic{background:var(--bg);border-radius:18px;margin:8px auto;display:block}
.pictitle{font-size:24px;font-weight:900;text-align:center;margin-top:6px}
.pic .pk{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.pic .d1{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.pic .d2{fill:none;stroke:var(--teal);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.pic .df{fill:var(--gold);stroke:none}
.pic .dk{fill:var(--ink);stroke:none}
.pic .du{fill:var(--teal-soft);stroke:none}
.pic .dg{fill:var(--gold-soft);stroke:var(--gold);stroke-width:2}
.pic .dt{fill:var(--accent);font-size: 22px;font-weight:900}
canvas.pad{width:100%;aspect-ratio:1/1;max-width:340px;display:block;margin:6px auto;background:var(--bg);border:2px dashed var(--line);border-radius:18px;touch-action:none}
.padbg{position:relative;max-width:340px;margin:0 auto}
.padbg .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size: 230px;font-weight:900;color:var(--ink);opacity:.09;pointer-events:none;line-height:1}
.padbg.y .ghost{font-size: 150px}
.navrow{display:flex;gap:10px;margin-top:16px}.navrow .btn{flex:1}
/* drill */
.qbox{text-align:center;padding:10px 0}
.qk{font-size: calc(140px * min(var(--fz), 1.15));line-height:1.1;font-weight:900}
.qk.mid{font-size:64px;padding:24px 0}
.qline{font-size:28px;line-height:1.3;font-weight:700;text-align:left}
.qhint{font-size:19px;color:var(--sub)}
.badge{display:inline-block;background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:2px 12px;font-size:16px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.qopts button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px 6px;font-size:30px;font-weight:900}
.qopts.kana button{font-size:48px;padding:8px 6px}
.qopts.gridpick{grid-template-columns:repeat(5,1fr);gap:6px}
.qopts.gridpick button{font-size:30px;padding:6px 2px;border-radius:12px}
.qopts button.sel{border-color:var(--gold);background:var(--gold-soft)}
/* one word = three stacked layers: furigana (ruby, above) / the word / romaji (below) */
/* lyric layout: word (.tk) → columns (.mo); each column = furigana (ruby) / character / its own romaji */
.tk{border-radius:8px;transition:background .08s;display:inline;margin-right:5px;padding:2px 1px}
.mo{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 0 14px;min-width:.9em}
.ms{line-height:1.25;padding-top:16px;white-space:nowrap}
.ms ruby{ruby-position:over}
.ms rt{font-size:13px;line-height:1;padding-bottom:3px}
.tr{font-size:12px;line-height:1.1;margin-top:3px;color:var(--accent);font-weight:700;font-family:system-ui,sans-serif;white-space:nowrap}
.tsp{display:inline-block;width:.5em}
.hide-rm .tr{visibility:hidden}
.mo.kara{background:var(--teal-soft);box-shadow:0 0 0 2px var(--teal);border-radius:6px}
/* big text sizes: never let anything push the page wider than the phone */
.overlay{overflow-x:hidden}
.otop{flex-wrap:wrap}
.otop .btn.small,.otop .chip{font-size: 15px;padding:5px 10px}
.src{flex-wrap:wrap}
.ln,.qline{overflow-wrap:anywhere}
.tcell{width:100%;min-height:58px;border:2px dashed var(--line);border-radius:12px;background:var(--card);font-size:30px;font-weight:900}
.tcell.ok{border-style:solid;border-color:var(--teal);background:var(--teal-soft)}
.tcell.ng{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.banner{background:var(--gold-soft);border-radius:16px;padding:12px 14px;margin:12px 0;display:flex;align-items:center;gap:10px;font-size:17px}
.qopts button.ok{border-color:var(--teal);background:var(--teal-soft)}
.qopts button.ng{border-color:var(--accent);background:var(--accent-soft)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.grade button{border:0;border-radius:16px;padding:16px 4px;font-size:20px;font-weight:900;color:#fff}
.g0{background:var(--accent)}.g1{background:var(--gold)}.g2{background:var(--teal)}
.qfb{min-height:40px;font-size:19px;margin-top:12px}
.seqbox{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.seqbox div{width:62px;height:72px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}
.seqbox div.show{border-style:solid;border-color:var(--teal);background:var(--teal-soft)}
.guide p,.guide li{font-size:19px}
.guide table{width:100%;border-collapse:collapse;font-size:19px}
.guide td,.guide th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top}
.kk{font-size:28px;font-weight:900}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:17px;z-index:50;display:none;max-width:90vw}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--sub);font-family:sans-serif}
.list{font-size:19px}.list div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
@media (max-width:380px){.cell .k,.cell .k2{font-size: calc(29px * min(var(--fz), 1.12))}.hero .big{font-size: calc(100px * min(var(--fz), 1.15))}.cell{min-height:70px}.qk{font-size: calc(120px * min(var(--fz), 1.15))}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ================= 训练 ================= -->
<section class="page on" id="p-home">
  <header><div class="wrap"><button class="chip" id="fzBtn" style="float:right;margin-top:4px">Aa 字号</button><h1>五十音 · 歌词记忆</h1><div class="sub" id="homeSub"></div></div></header>
  <div class="wrap">
    <div class="card" id="goalCard"></div>
    <button class="btn big" id="goMain">▶ 开始刷</button>
    <p style="font-size:16px;color:var(--sub);margin:8px 2px 0">平时只点这一个就够了：新字、复习和各种题型都混在里面，系统自己安排。</p>
    <div id="banner"></div>
    <div id="suggest"></div>
    <div class="card" id="progCard"></div>
    <details class="card more"><summary><b>更多练习</b><span style="color:var(--sub);font-size:15px">　想自己选的时候再打开</span></summary>
    <div class="homegrid">
      <button class="hbtn" id="goFlash"><b>⚡ 乱序闪认</b><span>全部假名随机闪，先混个眼熟</span></button>
      <button class="hbtn" id="goSeq"><b>🔁 顺背 / 倒背</b><span>按行、按段，正着、倒着背</span></button>
      <button class="hbtn" id="goSprint"><b>⏱ 60 秒冲刺</b><span id="bestScore">限时连答，练反应速度</span></button>
      <button class="hbtn" id="goTable"><b>📋 全表默写</b><span id="tableHint">每周一次，彻底检验</span></button>
      <button class="hbtn" id="goKata"><b>カ 片假名专练</b><span id="kataHint">只练片假名，最弱的先出</span></button>
      <button class="hbtn" id="goFocusAll"><b>🎯 薄弱字专练</b><span>系统找出的易错、慢的字</span></button>
    </div></details>
  </div>
</section>

<!-- ================= 五十音表 ================= -->
<section class="page" id="p-table">
  <header><div class="wrap"><h1>五十音表</h1>
    <div class="sub">每格上面是<b style="color:var(--ink)">平假名</b>、下面是<b style="color:var(--teal)">片假名</b>，点开看讲解、笔顺、歌词</div></div></header>
  <div class="wrap">
    <div class="legend"><span><i style="background:var(--line)"></i>未学</span><span><i style="background:var(--gold)"></i>学习中</span><span><i style="background:var(--teal)"></i>复习中</span><span><i style="background:var(--teal-soft);border:2px solid var(--teal)"></i>稳固</span><span><i style="background:var(--accent);border-radius:50%"></i>易错</span></div>
    <h2>清音</h2><div class="grid" id="g-basic"></div>
    <h2>浊音 · 半浊音</h2><div class="grid" id="g-daku"></div>
    <h2>拗音</h2><div class="grid y" id="g-you"></div>
    <h2>促音 · 长音 · 外来语扩展音</h2><div class="grid x" id="g-ext"></div>
  </div>
</section>

<!-- ================= 统计 ================= -->
<section class="page" id="p-stats">
  <header><div class="wrap"><h1>学习统计</h1><div class="sub">数据只存在这台设备的浏览器里，记得定期备份</div></div></header>
  <div class="wrap" id="statsBody"></div>
</section>

<!-- ================= 指南 ================= -->
<section class="page" id="p-guide">
  <header><div class="wrap"><h1>指南 · 设置</h1><div class="sub">系统怎么安排复习、发音要点、备份</div></div></header>
  <div class="wrap guide" id="guide"></div>
</section>

<nav class="tabs" id="tabs">
  <button data-p="p-home" class="on"><span class="ic">▶</span>训练</button>
  <button data-p="p-table"><span class="ic">あ</span>五十音</button>
  <button data-p="p-stats"><span class="ic">▤</span>统计</button>
  <button data-p="p-guide"><span class="ic">☰</span>指南</button>
</nav>

<div class="overlay" id="drill"></div>
<div class="overlay" id="sheet"></div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
const DATA = /*__DATA__*/null;

// ---------------- knowledge ----------------
// [hira, romaji, 平假名字源, 片假名字源说明, 记忆口诀, [词,意思], [词,意思], [片假名词,意思]]
const BASIC = [
['あ','a','安','阿 的左耳旁「阝」','“安”字草书。张大嘴喊“啊——”，像在山顶上大喊。',['あめ','雨'],['あさ','早上'],['アニメ','动画']],
['い','i','以','伊 的单人旁「亻」','两笔像“以”的左右两竖，读“衣”。两根小草并排站。',['いぬ','狗'],['いえ','家'],['イヤホン','耳机']],

  const plain = s => (s.match(/[ぁ-ゟ゠-ヿー]+|\s+|[^ぁ-ゟ゠-ヿー\s]+/g) || []).forEach(p => toks.push(isKana(p) ? {s:p, p:toHira(p)} : {s:p}));

}
function buildMyEx() {
  MYEX = {}; for (const k in MYSAY) delete MYSAY[k];

  S.myLyrics.forEach((sg, si) => {
    const seen = new Set();
    for (let raw of sg.text.split('\n')) {
      raw = raw.trim();
      if (!/[ぁ-ゖァ-ヺ]/.test(raw) || /作词|作曲|编曲|作詞|編曲|[:：]/.test(raw)) continue;
      const t = myTokens(raw), text = t.map(x => x.s).join(''), len = [...text.replace(/\s/g, '')].length;
      if (len < 4 || len > 40 || seen.has(text)) continue;

      lines.push({my:si, t, len});

  const SMALL = 'ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ';

    const single = [...tgt].length === 1;

      let n = 0;
      for (const x of l.t) {
        if (x.f || !isKana(x.s)) continue;
        for (let i = x.s.indexOf(tgt); i >= 0; i = x.s.indexOf(tgt, i + 1)) { const nx = x.s[i + tgt.length]; if (!(single && nx && SMALL.includes(nx))) n++; }

    }).filter(Boolean).sort((a, b) => b.s - a.s);

      if (pick.length >= 3) break;
      if (pick.includes(h.l) || (pass === 0 && songs.has(h.l.my))) continue;
      pick.push(h.l); songs.add(h.l.my);

}

// ---------------- scheduler ----------------
// learning steps inside a session, then day intervals. A card is "solid" after good answers on 3 different days.
const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
const LEARN = [0, 1 * MIN, 10 * MIN, 30 * MIN];

const solid = c => c && c.days >= 3;
function activate(ch, sk, st = 0) {

}
const primOf = ch => unitOf(ch).grp === 's' ? 'word' : 'see';

const seqKinds = ch => ['next', 'prev', 'down', 'up'].filter(k => { const n = neighbor(toHira(ch), k); return n && S.intro.includes(n); });

    if (s[i + 1] && 'ゃゅょ'.includes(s[i + 1]) && CH2U[s[i] + s[i + 1]]) { out.push(s[i] + s[i + 1]); i++; continue; }
    out.push(s[i] === 'ー' ? 'ー' : s[i]);

}
// a listening pair opens once every sound in both words has been introduced
function unlockMini() {
  MINI.forEach((m, i) => { if ([m[0][0], m[1][0]].every(w => unitsInWord(w).every(u => S.intro.includes(u)))) activate('mp' + i, 'mini', 1); });
}
function unlockFor(ch) {

  const sk = skillsOf(ch);
  // later skills start one step in: recognition already got them past the first exposure
  if (c.st >= 2) sk.filter(s => s === 'hear' || s === 'pair').forEach(s => activate(ch, s, 1));
  if (c.st >= 3) sk.filter(s => s === 'write' || s === 'lyric').forEach(s => activate(ch, s, 1));
  if (c.st >= 3 && sk.includes('seq') && seqKinds(ch).length) activate(ch, 'seq', 1);

  if (c.st >= 3 && isKataStr(ch) && kwordsFor(ch).length) activate(ch, 'kword', 1);

// introducing a unit can make old units' sequence questions possible
const unlockSeqAll = () => { S.intro.forEach(u => UNITS[UIDX[u]].chars.forEach(unlockFor)); unlockMini(); };
function grade(id, r, opt = {}) {

const activeCards = () => Object.keys(S.cards);
function nextGroupIndex() { for (let g = 0; g < GROUPS.length; g++) if (GROUPS[g].some(u => !S.intro.includes(u))) return g; return -1; }

  const reviewDue = ids.filter(id => card(id).st >= 4 && card(id).due <= now).length;

// pick the next card; filter limits to some characters (focus drill)

// ---------------- distractors ----------------
function sameScript(c, ref) { return isKataStr(ref) ? toKata(c) : toHira(c); }
function distractors(ch, n) {
  const out = [], seenR = new Set([unitRoma(ch)]);
  const add = c => { if (!c || out.length >= n || c === ch || out.includes(c) || !CH2U[c]) return; if (seenR.has(unitRoma(c))) return; seenR.add(unitRoma(c)); out.push(c); };
  // your own past mix-ups first
  Object.entries(S.conf).filter(([k]) => k.startsWith(ch + '>')).sort((a, b) => b[1] - a[1]).forEach(([k]) => add(k.split('>')[1]));
  lookAlikes(ch).forEach(add);
  const x = unitOf(ch), conv = y => x.grp === 'x' ? y.chars[0] : sameScript(y.chars[0], ch);
  // characters you have already met come first; unseen ones only fill up when too few are learned
  const learned = y => S.intro.includes(y.u);
  shuffle(UNITS.filter(y => y.row === x.row && learned(y))).forEach(y => add(conv(y)));
  shuffle(UNITS.filter(y => y.grp === x.grp && learned(y))).forEach(y => add(conv(y)));
  shuffle(UNITS.filter(y => learned(y) && y.grp !== 's' && (y.grp === 'x') === (x.grp === 'x'))).forEach(y => add(conv(y)));
  shuffle(UNITS.filter(y => y.row === x.row)).forEach(y => add(conv(y)));
  shuffle(UNITS.filter(y => y.grp === x.grp)).forEach(y => add(conv(y)));

  const r = romaji(w), out = new Set();
  out.add(r.replace(/([bcdfghjkmnprstvwz])\1/, '$1'));
  out.add(r.replace(/(aa|ii|uu|ee|oo|ou|ei)/, m => m[0]));

const KVOWEL = {};
for (const [v, row] of Object.entries({a:'あかさたなはまやらわがざだばぱゃぁ', i:'いきしちにひみりぎじぢびぴぃ', u:'うくすつぬふむゆるぐずづぶぷゅぅ', e:'えけせてねへめれげぜでべぺぇ', o:'おこそとのほもよろをごぞどぼぽょぉ'})) for (const c of row) KVOWEL[c] = v;

let karaRAF = 0, karaSeq = 0;
const PRE_MS = 0.05 / 0.95 * 1000; // silence VOICEVOX puts before the first beat (prePhonemeLength / speedScale)

    const ctx = speechBounds.ctx || (speechBounds.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const bin = atob(AUDIO[key]), buf = new Uint8Array(bin.length);

    for (let i = 0; i < d.length; i += win) {

}
// light up each character column in time with the recording
async function karaoke(text) {
  const seq = ++karaSeq;
  clearInterval(karaRAF);
  document.querySelectorAll('.mo.kara').forEach(e => e.classList.remove('kara'));
  const T = TIMINGS[text]; if (!T || !T.length) return;
  const lines = [...document.querySelectorAll('[data-kline]')].filter(e => e.dataset.kline === text);
  if (!lines.length) return;
  const cols = lines.map(l => [...l.querySelectorAll('.mo[data-mn]')].map(el => ({el, a:+el.dataset.m0, n:+el.dataset.mn})));
  const total = cols[0].reduce((s, c) => Math.max(s, c.a + c.n), 0) || 1;

  const starts = [PRE_MS, ...T.slice(0, -1)], t0 = starts[0], t1 = T[T.length - 1];

  let on = t0, off = t1;
  speechBounds(text).then(b => { if (b && seq === karaSeq) { on = b[0]; off = b[1]; } });

  clearInterval(karaRAF);
  karaRAF = setInterval(() => {
    if (player.paused || player.ended || seq !== karaSeq) {
      clearInterval(karaRAF);
      for (const list of cols) for (const c of list) c.el.classList.remove('kara');
      return;
    }
    // map the playback position onto the predicted beat timeline (works for slow playback too)
    const tl = t0 + (player.currentTime * 1000 - on) * (t1 - t0) / Math.max(1, off - on);

}

// play one character, one word and one lyric line and report exactly which step fails, and why
async function soundCheck() {
  const out = $('#scOut'), lines = [];
  const show = () => out.innerHTML = lines.join('<br>');
  const ua = navigator.userAgent, br = (ua.match(/(Edg|OPR|Firefox|Chrome|Version)\/[\d.]+/g) || [ua.slice(0, 50)]).join(' ');
  lines.push(`浏览器：${esc(br)}${location.protocol === 'file:' ? '（本地文件打开）' : ''}`);
  const first = Object.values(DATA.ex).flat()[0];
  for (const [name, key] of [['单字 か', 'か'], ['单词 ねこ', 'ねこ'], ...(first ? [['歌词一句', lineText(first)]] : [])]) {
    lines.push(`${name}：播放中…`); show();
    try {
      if (!AUDIO[key]) throw new Error('网页里没有这段录音');
      const a = new Audio(clipUrl(key));
      await a.play();
      await new Promise(r => { a.onended = r; setTimeout(r, 8000); });
      lines[lines.length - 1] = `${name}：✅ 播放成功（${a.duration.toFixed(1)} 秒）`;
    } catch (e) { lines[lines.length - 1] = `${name}：❌ 失败（${esc(e.name || '')} ${esc(e.message || '')}）`; }
    show();
  }
  lines.push('三段都听到了就说明正常。哪一步是 ❌，或者显示成功却没听到声音，把这一段截图发给我。');
  show();
}

function renderGuide() {
  $('#guide').innerHTML = `
  <p style="color:var(--sub);font-size:16px">每一节点开看，用到哪节看哪节。</p>
  <details class="card fold" open><summary><b>① 这套训练怎么运作</b></summary><ol>
    <li><b>只管点“开始刷”。</b>新字、复习、各种题型全部混着出，什么时候复习哪个字由系统安排。</li>

    <li><b>又对又快。</b>答对但超过 3 秒，算“慢”，这个字会继续多出现。</li>
    <li><b>能力一级级解锁：</b>先认读，再听辨、平片互转，再默写、顺序、歌词。</li>
    <li><b>当前的字稳了才放新字。</b>复习积压太多时，系统会先让你复习。</li>
    <li><b>每 30 分钟提醒休息。</b>注意力下降后刷题效果会明显变差。</li>
    <li><b>随时点 💡 看讲解。</b>答题前看了讲解，这题按“没想起”记，这样记录才真实。</li>
  </ol>
  <p><b>每天的流程：</b>看首页「今日目标」→ 点「开始刷」→ 每 30 分钟歇一下 → 首页出现推荐练习时顺手做一下 → 睡前再刷 10 分钟复习。</p></details>

  <details class="card fold"><summary><b>② 记得牢的方法（为什么这样练）</b></summary><ol>
    <li><b>先想再看答案。</b>自己努力回想的那一下，比看十遍都管用。所以每道题都先答，答不出来再看讲解。</li>
    <li><b>隔开复习。</b>同一个字隔几分钟、隔几天再考，比一口气刷二十遍记得牢得多。当天刷熟只是短期记忆。</li>
    <li><b>平片混着练。</b>平假名、片假名、不同题型混在一起，逼大脑真正区分，不靠“这一组都是 か 行”去猜。</li>
    <li><b>多感官一起上。</b>看、听、读出声、手写同时用：读出声的字比默读记得牢，手写能记住笔画细节。</li>
    <li><b>给每个字找个“钩子”。</b>字源（这个假名是从哪个汉字变来的）、图像卡、口诀，最好再自己编一个和你喜欢的角色、歌有关的口诀——自己想出来的最牢。</li>
    <li><b>在歌词里见到它。</b>同一个字在熟悉的歌里反复出现，记忆会自动加固。听歌时留意学过的字。</li>
    <li><b>别把罗马音当拐杖。</b>罗马音只是入门时的辅助。假名应该直接对应声音，而不是“看到 か → 想到 ka → 再发音”。字练稳后可以在设置里打开“罗马音逐步淡出”。</li>
    <li><b>答错是好事。</b>错过并马上看到正确答案的字，往往记得最牢。易混字选错时，看清两个字的区别再走。</li>
    <li><b>睡眠帮你巩固。</b>睡前复习一轮效果特别好；熬夜硬刷效果反而差。</li>
    <li><b>注意细节，不只记“大概样子”。</b>很多混淆（さ/き、ソ/ン、シ/ツ）都是因为只记了整体轮廓。看清笔画的方向、有没有打圈、有没有多一横。</li>
  </ol></details>

  <details class="card fold"><summary><b>③ 发音要点（总论）</b></summary>
    <p><b>拍（节拍）：</b>日语按“拍”数节奏，每个假名占一拍，拍与拍时长基本相同。小写的 ゃゅょ 跟前面的字合成一拍；促音 っ、拨音 ん、长音都各自单独占一拍。<span lang="ja">にっぽん</span> 是 に・っ・ぽ・ん 四拍。</p>
    <p><b>五个元音：</b>a i u e o，短、干脆、口型不变。最常见的问题：う 撅嘴（应放松扁唇）、え 滑成“ei”、お 滑成“ou”。</p>
    <p><b>清音和浊音：</b>日语区分的是“声带振不振动”（か/が、た/だ、さ/ざ、は/ば），而汉语普通话区分的是“送不送气”。所以中国人容易把词中的 か 听成 が。练习时把手放在喉咙上，浊音能感觉到振动。</p>
    <p><b>长音：</b>元音拉长一拍，长短不同意思就不同：<span lang="ja">おばさん</span>（阿姨）/ <span lang="ja">おばあさん</span>（奶奶），<span lang="ja">ビル</span>（大楼）/ <span lang="ja">ビール</span>（啤酒）。平假名的写法规律：a 段加 あ、i 段加 い、u 段加 う、e 段多数加 い（<span lang="ja">せんせい</span> 读 sensee）、o 段多数加 う（<span lang="ja">おとうさん</span> 读 otoosan）。片假名统一用「ー」。</p>
    <p><b>促音 っ：</b>停顿一拍，口型先摆好下一个辅音。<span lang="ja">きて</span>（来）/ <span lang="ja">きって</span>（邮票）意思完全不同。只出现在 か さ た ぱ 行等清音前（外来语例外）。</p>
    <p><b>拨音 ん：</b>独占一拍的鼻音，会随后一个音变化：b/p/m 前读 m（<span lang="ja">さんぽ</span>），k/g 前读 ng（<span lang="ja">りんご</span>），元音前要断开（<span lang="ja">きんえん</span> 是 kin-en，不是 ki-nen）。</p>
    <p><b>元音清化：</b>i、u 夹在两个清辅音之间，或在句末的 す 里，常常几乎不发出声，只剩气流：<span lang="ja">すき</span>（s-ki）、<span lang="ja">です</span>（des）、<span lang="ja">した</span>（sh-ta）。听录音时会发现这些音“被吃掉”了，这是正常的。</p>
    <p><b>音调（高低）：</b>日语靠音的高低区分词（<span lang="ja">はし</span> 读作“低高”是桥，“高低”是筷子），不像汉语那样每个字有声调。五十音阶段先不用专门练，多听录音、跟读就会慢慢有感觉。</p>
    <p><b>助词的读法：</b>写作 は へ を，作助词时读 wa e o。</p>
  </details>

  <details class="card fold"><summary><b>④ 书写要点（总论）</b></summary><ul>
    <li><b>笔顺原则：</b>先上后下、先左后右、先横后竖。五十音表里点开任意一个字，看“笔顺动画”。</li>
    <li><b>风格：</b>平假名圆润、有弧度，像毛笔草书；片假名直、有棱角，笔画少。片假名写圆了就容易和平假名混。</li>
    <li><b>区分的关键往往在“结尾”：</b>打不打圈（ぬ/め、る/ろ、ね/れ/わ），往哪个方向收笔（シ 往上挑 / ツ 往下撇，ソ 从上往下 / ン 从下往上）。</li>
    <li><b>多一笔少一笔：</b>き/さ（き 多一横）、は/ほ（ほ 多一横）、ウ/ワ（ウ 有顶点）、タ/ク（タ 多一点）、ヌ/ス（ヌ 多一点）。</li>
    <li><b>小字：</b>ゃゅょっァィゥェォ 要写成大约一半大，并靠下。写大了读音就变了（きや ≠ きゃ）。</li>
    <li><b>浊点和半浊点：</b>「゛」「゜」写在右上角，最后写。</li>
    <li><b>长音符号：</b>横写时是「ー」，竖写时变成竖线「｜」。不要和数字“一”混淆，ー 比“一”短一点、居中。</li>
  </ul></details>

  <details class="card fold"><summary><b>⑤ 片假名专题</b></summary>
    <p><b>来源：</b>片假名都是取汉字的一部分（伊→イ、加→カ、八→ハ），平假名是整个汉字的草书。所以片假名经常能直接对上一个汉字部件，讲解页里每个字都写了来源。</p>
    <p><b>用在哪里：</b>外来词（<span lang="ja">アニメ、ゲーム</span>）、外国人名地名、拟声词、强调，以及动植物名称等。歌名、角色名、游戏术语里大量出现，所以对 ACG 爱好者特别重要。</p>
    <p><b>外来语的规律（读懂片假名词的关键）：</b></p><ul>
      <li>英语的长元音、-er / -or 结尾多变成长音「ー」：<span lang="ja">コーヒー、コンピューター</span>。</li>
      <li>双写辅音、短促的音变成促音「ッ」：<span lang="ja">ベッド、カップ</span>。</li>
      <li>辅音结尾要补元音，t/d 后一般补 o，其他多补 u：<span lang="ja">ケーキ、ゲーム、ベッド</span>。</li>
      <li>日语没有的音用“大字 + 小写”拼：fa → <span lang="ja">ファ</span>、ti → <span lang="ja">ティ</span>、di → <span lang="ja">ディ</span>、v → <span lang="ja">ヴ</span>（也常写成 バ 行）。</li>
      <li>L 和 R 都写成 ラ 行；th 一般写成 サ 行或 ザ 行。</li>
      <li>拼出来后要用日语的方式读，不要用英语读法：コート 一定要读长，读短了就不是“大衣”了。</li>
    </ul>
    <p><b>为什么片假名更难记：</b>平时见得少、笔画简单彼此很像（シツソン、クケタ、コユ）。对策：多做“平片互转”和“读片假名词”，首页出现“片假名专练”推荐时优先做。</p>
  </details>

  <details class="card fold"><summary><b>⑥ ぢ / づ 和容易拼错的地方</b></summary><ul>
    <li><b>ぢ 和 じ、づ 和 ず 读音相同。</b>大多数词用 じ ず；只有两种情况用 ぢ づ：<br>
      ① 两个词连起来，后一个词的 ち/つ 变浊：<span lang="ja">はな＋ち → はなぢ</span>（鼻血），<span lang="ja">みか＋つき → みかづき</span>（新月）。<br>
      ② 同一个音紧接着重复并变浊：<span lang="ja">ちぢむ</span>（缩），<span lang="ja">つづく</span>（继续）。</li>
    <li><b>长音别多写或少写：</b><span lang="ja">おとうさん</span>（不是 おとさん）、<span lang="ja">とおい</span>（例外：这里写 お 不写 う）。</li>
    <li><b>促音和长音不要写成大字：</b>きって 不是 きつて，ケーキ 的长音是「ー」不是“一”。</li>
    <li><b>拗音的小字：</b>しゃしん 不是 しやしん。</li>
  </ul></details>

  <details class="card fold"><summary><b>⑦ 罗马音规则（读音 vs 打字）</b></summary>
    <p>本工具用的是最常见的“赫本式”拼法，更接近实际读音。用手机/电脑打日文时，有几处输入方法不一样：</p>
    <table lang="ja">

  <details class="card fold"><summary><b>⑧ 拼写规则速查</b></summary><table lang="ja">
    <tr><td class="kk">か→が</td><td>浊音：右上加「゛」，声带振动。</td></tr>
    <tr><td class="kk">は→ぱ</td><td>半浊音：は 行右上加「゜」，变成 p。</td></tr>
    <tr><td class="kk">きゃ</td><td>拗音：い段字 + 小写 ゃゅょ，合成一拍。</td></tr>
    <tr><td class="kk">きって</td><td>促音：小写「っ」停顿一拍，下一个辅音双写（kitte）。</td></tr>
    <tr><td class="kk">ケーキ</td><td>长音：元音拉长一拍，片假名用「ー」。</td></tr>
    <tr><td class="kk">ファ</td><td>外来语扩展音：大字 + 小写 ァィゥェォ。</td></tr>
    <tr><td class="kk">は へ を</td><td>作助词分别读 wa / e / o。</td></tr>
  </table></details>

  <details class="card fold"><summary><b>⑨ 中国人容易读错的音</b></summary><table lang="ja">${['う','え','し','ち','つ','す','ふ','ら','ん','ぢ'].map(k => `<tr><td class="kk">${k}</td><td>${NOTE[k] || {'え':'嘴角向两边开，不要滑成汉语的“ei”。','す':'嘴唇不撅；句末的 す 常常只剩 s 音（です 读 des）。'}[k] || ''}</td></tr>`).join('')}
    <tr><td class="kk">か/が</td><td>日语分清浊（声带振动），不分送气。词中的 か 别读成 が，が 要振动声带。</td></tr>

  <details class="card fold"><summary><b>⑩ 常见错误清单（自查）</b></summary><ol>
    <li>看罗马音读字，不直接把假名和声音连起来。</li>
    <li>シ/ツ、ソ/ン 只看形状不看笔画方向。</li>
    <li>ぬ/め、る/ろ、ね/れ/わ 忘了看结尾有没有打圈。</li>
    <li>さ/ち 镜像搞反；き/さ 少写一横。</li>
    <li>拗音的小字写成大字：きや ≠ きゃ。</li>
    <li>促音、长音漏读或多读，节拍不对。</li>
    <li>助词 は へ を 按字面读成 ha he wo。</li>
    <li>つ 读成“苏”、ふ 咬下唇读成 fu。</li>
    <li>ら 行卷舌或读成 l 拖长。</li>
    <li>ん 读得太短，没占满一拍。</li>
    <li>外来语按英语读，不按日语的拍子和长音读。</li>
    <li>只练平假名，片假名长期落后。</li>
    <li>当天刷到很熟就以为记住了，第二天不复习。</li>

  <div class="card"><b>🎵 我的歌词</b>
    <p style="color:var(--sub);margin:6px 0 10px">把喜欢的日语歌的歌词贴进来，每个假名会配上你自己歌里的句子，出现在讲解页和“歌词认字”题里。</p>
    ${S.myLyrics.length ? `<div class="list" style="margin-bottom:12px">${S.myLyrics.map((s, i) => `<div><span lang="ja"><b>${esc(s.title)}</b>${s.artist ? ` <small style="color:var(--sub)">${esc(s.artist)}</small>` : ''}</span><button class="chip" data-mydel="${i}">删除</button></div>`).join('')}</div>` : ''}
    <button class="btn teal small" id="myAdd">＋ 导入歌词</button>
  </div>
  <div class="card"><b>备份与设置</b>
    <p>学习记录只存在这台手机的浏览器里。清除浏览器数据或换手机前，先导出备份。</p>
    <div class="list" style="margin-bottom:12px">
      <div><span><b>罗马音逐步淡出</b><br><small style="color:var(--sub)">字练稳后，认读题改成听声音选，不再靠罗马音</small></span><button class="chip ${S.pref.fade ? 'on' : ''}" id="tFade">${S.pref.fade ? '已开' : '已关'}</button></div>
      <div><span><b>整句朗读</b><br><small style="color:var(--sub)">字稳固后出整句歌词，自己读再核对</small></span><button class="chip ${S.pref.readLine ? 'on' : ''}" id="tRead">${S.pref.readLine ? '已开' : '已关'}</button></div>
    </div>
    ${APP ? `<div class="list" style="margin-bottom:12px">${[[1, '每日练习提醒'], [2, '睡前复习提醒']].map(([id, name]) => {
      const [on, h, m] = APP.getReminder(id).split(',');
      return `<div><span><b>${name}</b><br><input type="time" id="remT${id}" value="${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}" style="font:inherit;font-size:18px;margin-top:4px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></span><button class="chip ${on === 'true' ? 'on' : ''}" data-rem="${id}">${on === 'true' ? '已开' : '已关'}</button></div>`;
    }).join('')}</div>` : ''}
    <div style="margin-bottom:12px"><b>字号</b><div class="seg" id="fzSeg">${FZ.map(([v, n]) => `<button data-fz="${v}" class="${(S.pref.fz || 1) === v ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    <div style="margin-bottom:12px"><button class="btn teal small" id="soundCheck">🔊 声音自检</button>
      <div id="scOut" style="font-size:16px;margin-top:8px;line-height:1.7"></div></div>
    <div class="toggles"><button class="btn small" id="exp">导出记录</button><button class="btn ghost small" id="imp">导入记录</button><button class="btn ghost small" id="theme">深色 / 浅色</button><button class="btn ghost small" id="reset">清空记录</button></div>
  </div>
  <p style="color:var(--sub);font-size:15px">/*__LYRICSRC__*/<br>发音录音：VOICEVOX:/*__VOICE__*/<br>单词真人发音：Kanji alive（<span>https://kanjialive.com</span>，CC BY 4.0，原样使用未修改）；Fukujinzuke（Lingua Libre / Wikimedia Commons，CC BY 4.0）<br>笔顺数据：KanjiVG（Ulrich Apel，CC BY-SA 3.0）<br>图像记忆卡、口诀为原创</p>`;
  $('#exp').onclick = exportBackup;
  $('#myAdd').onclick = myLyricForm;
  document.querySelectorAll('[data-mydel]').forEach(b => b.onclick = () => {
    const s = S.myLyrics[+b.dataset.mydel];
    if (!confirm(`删除「${s.title}」的歌词？`)) return;
    S.myLyrics.splice(+b.dataset.mydel, 1); buildMyEx(); save(); renderGuide(); toast('已删除');
  });
  // reminders (app only): toggle on/off, or change the time while on
  document.querySelectorAll('[data-rem]').forEach(b => b.onclick = () => {
    const id = +b.dataset.rem, on = !b.classList.contains('on'), [h, m] = $('#remT' + id).value.split(':').map(Number);
    APP.setReminder(id, h, m, on); renderGuide(); toast(on ? `已设置：每天 ${$('#remT' + id).value} 提醒` : '已关闭提醒');
  });
  document.querySelectorAll('[id^=remT]').forEach(inp => inp.onchange = () => {
    const id = +inp.id.slice(4), btn = document.querySelector(`[data-rem="${id}"]`), [h, m] = inp.value.split(':').map(Number);
    if (btn.classList.contains('on')) { APP.setReminder(id, h, m, true); toast(`提醒时间改为 ${inp.value}`); }
  });
  $('#soundCheck').onclick = soundCheck;
  document.querySelectorAll('#fzSeg button').forEach(b => b.onclick = () => setFz(+b.dataset.fz));
  $('#tFade').onclick = () => { S.pref.fade = !S.pref.fade; save(); renderGuide(); };
  $('#tRead').onclick = () => { S.pref.readLine = !S.pref.readLine; save(); if (S.pref.readLine) unlockSeqAll(); renderGuide(); };
  $('#imp').onclick = () => $('#importFile').click();
  $('#reset').onclick = () => { if (confirm('确定清空所有学习记录？建议先导出备份。')) { S = blank(); save(); renderAll(); toast('已清空'); } };
  $('#theme').onclick = () => {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
    S.pref.theme = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.pref.theme; save();
  };
}
function myLyricForm() {
  const box = 'font:inherit;font-size:18px;width:100%;box-sizing:border-box;margin:6px 0;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)';
  showModal(`<b>导入歌词</b>
    <input id="myT" placeholder="歌名" style="${box}">
    <input id="myA" placeholder="歌手（可不填）" style="${box}">
    <textarea id="myX" rows="9" lang="ja" placeholder="把日语歌词粘贴到这里，一行一句" style="${box};resize:vertical"></textarea>
    <p style="color:var(--sub);font-size:15px;margin:4px 0 10px">汉字想要注音，就在后面加括号写读音：夢(ゆめ)、紅葉(もみじ)；没加的汉字照原样显示。<br>这些句子没有内置录音，用手机自带的日语语音朗读。</p>
    <div class="toggles"><button class="btn small" id="mySave">保存</button><button class="btn ghost small" id="myCancel">取消</button></div>`);
  $('#myCancel').onclick = hideModal;
  $('#mySave').onclick = () => {
    const title = $('#myT').value.trim(), artist = $('#myA').value.trim(), text = $('#myX').value;
    if (!title) return toast('先写上歌名');
    if (!/[ぁ-ゖァ-ヺ]/.test(text)) return toast('没找到日语假名，请粘贴日语歌词');
    S.myLyrics.push({title, artist, text});
    const n = buildMyEx();
    unlockSeqAll(); save(); hideModal(); renderGuide();
    toast(`已导入「${title}」：共 ${n} 句，${Object.keys(MYEX).length} 个假名有了你自己的歌词`);
  };
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.cards || !d.intro) throw 0; if (confirm('用这个备份覆盖当前记录？')) { S = Object.assign(blank(), d); save(); renderAll(); toast('已导入'); } } catch (err) { toast('这个文件不是有效的备份'); } };
  r.readAsText(f); e.target.value = '';
});

// ---------------- tabs / init ----------------
function renderAll() { renderHome(); renderTable(); renderStats(); }
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section.page').forEach(p => p.classList.toggle('on', p.id === b.dataset.p));
  if (b.dataset.p === 'p-home') renderHome();
  if (b.dataset.p === 'p-table') renderTable();
  if (b.dataset.p === 'p-stats') renderStats();
  window.scrollTo(0, 0);
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#sheet').classList.contains('on')) closeSheet(); else if ($('#modal').classList.contains('on')) hideModal(); } });
if (S.pref.theme) document.documentElement.dataset.theme = S.pref.theme;
applyFz();
buildMyEx();
renderAll(); renderGuide();
</script>
</body>
</html>
